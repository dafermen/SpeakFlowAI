name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-content-and-docs:
    name: Web, content and docs
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Focused foundation tests
        run: pnpm test

      - name: Build applications and documentation
        run: pnpm build

      - name: Enforce web bundle budgets
        run: pnpm --filter @speakflow/web check:bundle

      - name: Validate native configuration
        run: pnpm --filter @speakflow/web check:native

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

  api:
    name: FastAPI and SQLite
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml

      - name: Install API
        run: python -m pip install -e "./apps/api[dev]"

      - name: Lint
        run: python -m ruff check apps/api

      - name: Typecheck
        run: python -m mypy apps/api/src

      - name: Backend and migration tests
        run: python -m pytest apps/api/tests --basetemp .pytest-tmp

      - name: Verify Python dependency compatibility
        run: python -m pip check
