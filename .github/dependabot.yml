version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      frontend-foundation:
        patterns:
          - "*"

  - package-ecosystem: pip
    directory: /apps/api
    schedule:
      interval: weekly
    groups:
      backend-foundation:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
