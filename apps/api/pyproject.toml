[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "speakflow-api"
version = "1.0.0"
description = "FastAPI backend for SpeakFlowAI."
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.18.5,<1.19",
  "fastapi>=0.141.1,<0.142",
  "httpx>=0.28.1,<0.29",
  "pydantic>=2.13.4,<3",
  "sqlalchemy>=2.0.51,<2.1",
  "uvicorn[standard]>=0.52.0,<0.53",
]

[project.optional-dependencies]
dev = [
  "mypy>=2.3.0,<2.4",
  "pytest>=9.1.1,<10",
  "ruff>=0.16.1,<0.17",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["speakflow_api"]
